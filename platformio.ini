[platformio]
default_envs = esp32_wifi
src_dir = .
include_dir = .
test_dir = tests

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 230400
build_flags = -DARDUINO_ARCH_ESP32 -DCONFIG_IDF_TARGET_ESP32
build_src_filter = +<*> -<tests/> -<tools/> -<docs/> -<dashboard/>

[env:esp32_wifi]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DROBOT_WIFI_DASHBOARD=1
extra_scripts = pre:tools/embed_dashboard.py
